name: crm-koc-prod-api

services:
  api:
    # Xem ghi chú ở compose.api.staging.yml. Prod dùng dải cổng 301x để hai stack
    # chạy song song trên cùng một host mà không đụng nhau.
    ports:
      - '127.0.0.1:3011:3000'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M

  api-migrate:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  api-worker:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
