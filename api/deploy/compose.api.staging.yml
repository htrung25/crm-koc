name: crm-koc-staging-api

services:
  api:
    # Cửa ngõ là nginx chạy trên host, không phải Caddy trong container — nên
    # phải publish ra loopback cho nginx proxy tới. Bind 127.0.0.1 để cổng này
    # không lộ ra internet; ufw chỉ mở 22/80/443.
    ports:
      - '127.0.0.1:3001:3000'
    networks:
      internal:
      edge:
        aliases:
          - api-staging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  api-migrate:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  api-worker:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 384M
