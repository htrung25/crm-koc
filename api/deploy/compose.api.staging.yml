name: crm-koc-staging-api

services:
  api:
    # Cửa ngõ là nginx chạy trên host. Bind vào 127.0.0.1 để cổng này chỉ nginx
    # gọi được, không lộ ra internet — ufw chỉ mở 22/80/443.
    ports:
      - '127.0.0.1:3001:3000'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  api-migrate:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  api-worker:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 384M
