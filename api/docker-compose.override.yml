# Compose tự merge file này khi chạy `docker compose up` => mặc định là DEV.
# Muốn chạy đúng image production: `docker compose -f docker-compose.yml up`.
services:
  api:
    build:
      target: dev
    image: crm-koc-api:dev
    environment:
      NODE_ENV: development
    volumes:
      # Bind-mount source để hot reload; node_modules giữ nguyên bản trong image
      # (native addon build cho Linux, không dùng chung với macOS được).
      - .:/app
      - /app/node_modules
      # KHÔNG mount volume cho /app/dist: nest-cli có deleteOutDir=true, gặp mount
      # point sẽ chết vì EBUSY khi rmdir. Đổi lại, dist do container build sẽ ghi
      # đè lên dist trên host — chạy lại `npm run build` ở host trước khi dùng
      # `npm run start:prod` native.
    command: ['npm', 'run', 'start:dev']
