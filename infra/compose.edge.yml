# Stack cửa ngõ: Caddy (TLS) + Uptime Kuma (giám sát). Deploy một lần.
# Các service khác cắm vào network `edge` để Caddy reverse proxy.
#
#   docker compose -f compose.edge.yml up -d
name: crm-koc-edge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *default-logging
    networks:
      - edge

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma-data:/app/data
    logging: *default-logging
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge

volumes:
  caddy-data:
  caddy-config:
  kuma-data:
