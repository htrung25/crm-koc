# Uptime Kuma. Cài như staging.conf; container do compose.monitoring.yml dựng.
#
#   uptime-kuma -> 127.0.0.1:3003

server {
    listen 80;
    server_name status.crm-koc.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        # Kuma đẩy trạng thái realtime qua WebSocket; thiếu 2 header này thì
        # dashboard hiện lên nhưng không bao giờ cập nhật.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
