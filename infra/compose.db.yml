# Database & Cache stack (Postgres + Redis).
# Sử dụng cho từng môi trường:
#   docker compose --env-file /srv/crm-koc/staging/.env -f compose.db.yml -p crm-koc-staging-db up -d
#   docker compose --env-file /srv/crm-koc/prod/.env -f compose.db.yml -p crm-koc-prod-db up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    networks:
      - internal

networks:
  internal:
    external: true
    name: ${STACK:-staging}_internal

volumes:
  postgres-data:
  redis-data:
