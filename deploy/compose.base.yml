# Định nghĩa chung cho cả staging lẫn prod. Không dùng một mình — luôn kèm một
# file override:
#   docker compose -f compose.base.yml -f compose.staging.yml ...
#
# Không service nào publish port ra host. Caddy ở stack `edge` là cửa duy nhất,
# nó tìm web/api qua network alias mà file override đặt.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ để shell trong container tự giãn biến, không phải compose giãn.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    networks:
      - internal

  # One-shot. Migration hỏng => exit != 0 => `api` không khởi động => container
  # cũ vẫn phục vụ traffic và job deploy fail.
  api-migrate:
    image: ${API_IMAGE:?API_IMAGE chưa được set}
    restart: 'no'
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Entrypoint không được tự chạy migration ở đây; command mới là migration.
      RUN_MIGRATIONS: 'false'
    command: ['npm', 'run', 'migration:run']
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - internal

  api:
    image: ${API_IMAGE:?API_IMAGE chưa được set}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Ghi đè để trỏ vào service trong stack, bất kể .env ghi gì.
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      RUN_MIGRATIONS: 'false'
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    logging: *default-logging
    networks:
      - internal
      - edge

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE chưa được set}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      # FE gọi API server-side, đi thẳng trong network nội bộ.
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    networks:
      - internal
      - edge

networks:
  internal:
  edge:
    external: true
    name: edge

volumes:
  postgres-data:
  redis-data:
  uploads:
