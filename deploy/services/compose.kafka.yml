name: ${STACK:-staging}-kafka

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=kafka:33145
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --default-log-level=info
    volumes:
      - kafka-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy --brokers=127.0.0.1:9092"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks:
      - internal

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rpk topic create audit-log-events
        --if-not-exists --partitions 3 --replicas 1
        --topic-config retention.ms=2592000000
        --brokers kafka:9092 &&
        rpk topic create audit-log-events.dlq
        --if-not-exists --partitions 1 --replicas 1
        --topic-config retention.ms=7776000000
        --brokers kafka:9092
    logging: *default-logging
    networks:
      - internal

networks:
  internal:
    external: true
    name: ${STACK:-staging}_internal

volumes:
  kafka-data:
