# Cửa ngõ production. Xem deploy/nginx/staging.conf để biết cách cài và vì sao
# file này không được deploy tự động.
#
#   api-prod  -> 127.0.0.1:3011
#   web-prod  -> 127.0.0.1:3012

server {
    listen 80;
    server_name api.crm-koc.duckdns.org;

    # Upload KYC có thể lớn; giữ khớp KYC_MAX_FILE_SIZE_BYTES (10MB) + overhead.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name crm-koc.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
