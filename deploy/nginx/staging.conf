server {
    listen 80;
    server_name api.stg.crm-koc.duckdns.org;

    # Upload KYC có thể lớn; giữ khớp KYC_MAX_FILE_SIZE_BYTES (10MB) + overhead.
    client_max_body_size 12M;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    # Giữ hostname cũ trong giai đoạn chuyển đổi để các link/bookmark cũ không
    # bị gián đoạn, nhưng canonical URL luôn là hostname mới.
    server_name staging.crm-koc.duckdns.org stg.crm-koc.duckdns.org;

    if ($host = stg.crm-koc.duckdns.org) {
        return 301 https://staging.crm-koc.duckdns.org$request_uri;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
