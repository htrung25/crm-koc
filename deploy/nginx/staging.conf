# Cửa ngõ staging. nginx chạy trên host (không phải container), proxy tới cổng
# mà compose.api.staging.yml / compose.web.staging.yml publish ra loopback.
#
# Cài trên server:
#   sudo cp deploy/nginx/staging.conf /etc/nginx/sites-available/crm-koc-staging.conf
#   sudo ln -sfn /etc/nginx/sites-available/crm-koc-staging.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.stg.crm-koc.duckdns.org -d stg.crm-koc.duckdns.org
#
# File này KHÔNG được deploy tự động: workflow chạy bằng user `deploy` (không có
# sudo), còn reload nginx cần root. Sửa ở đây rồi cài tay theo lệnh trên.
# certbot tự chèn block `listen 443 ssl` và redirect 80 -> 443 vào bản trên
# server, nên bản server sẽ dài hơn file này.

server {
    listen 80;
    server_name api.stg.crm-koc.duckdns.org;

    # Upload KYC có thể lớn; giữ khớp KYC_MAX_FILE_SIZE_BYTES (10MB) + overhead.
    client_max_body_size 12M;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name stg.crm-koc.duckdns.org;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
