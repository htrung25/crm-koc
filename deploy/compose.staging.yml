# Staging. Project name khác prod nên volume, network nội bộ và container đều
# tách hẳn — hai stack chỉ gặp nhau ở network `edge`.
name: crm-koc-staging

services:
  api:
    networks:
      internal:
      edge:
        # Caddy tìm theo alias này. Không được trùng với prod.
        aliases:
          - api-staging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  web:
    networks:
      internal:
      edge:
        aliases:
          - web-staging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  postgres:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
