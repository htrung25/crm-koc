name: crm-koc-staging-web

services:
  web:
    # Xem ghi chú ở compose.api.staging.yml: nginx trên host proxy qua loopback.
    ports:
      - '127.0.0.1:3002:3000'
    networks:
      internal:
      edge:
        aliases:
          - web-staging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
