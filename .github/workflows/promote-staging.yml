name: promote-staging

# Đưa develop lên staging bằng fast-forward thay vì PR merge.
#
# PR merge tạo một merge commit CHỈ tồn tại trên staging, khiến staging vĩnh
# viễn đi trước develop một commit — đó là nguồn gốc của banner "Compare &
# pull request" quay lại sau mỗi lần release. Fast-forward không tạo commit
# nào: hai nhánh về cùng SHA.
#
# PHẢI dùng PAT, không dùng GITHUB_TOKEN: push bằng GITHUB_TOKEN không kích
# hoạt workflow khác, nên build-push sẽ không chạy và staging sẽ không được
# deploy — hỏng mà không báo. Tạo fine-grained PAT có quyền Contents: write
# trên repo này, lưu vào secret PROMOTE_TOKEN.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ 'promote' để xác nhận đẩy develop lên staging"
        required: true

permissions:
  contents: read

concurrency:
  group: promote-staging
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Chan bam nham
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "promote" ]; then
            echo "::error::Can go dung 'promote' de xac nhan."
            exit 1
          fi

      - name: Kiem tra secret PROMOTE_TOKEN
        env:
          TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Thieu secret PROMOTE_TOKEN. Push bang GITHUB_TOKEN se"
            echo "::error::khong kich hoat build-push, staging se khong duoc deploy."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN }}

      - name: Xac dinh SHA va kiem tra fast-forward
        id: check
        run: |
          git fetch origin develop staging --quiet
          develop_sha=$(git rev-parse origin/develop)
          staging_sha=$(git rev-parse origin/staging)
          echo "develop = $develop_sha"
          echo "staging = $staging_sha"

          if [ "$develop_sha" = "$staging_sha" ]; then
            echo "::notice::staging da bang develop, khong co gi de day."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # staging phai la to tien cua develop, neu khong thi da co nguoi day
          # thang vao staging va fast-forward se lam mat commit do.
          if ! git merge-base --is-ancestor "$staging_sha" "$develop_sha"; then
            echo "::error::Khong fast-forward duoc: staging co commit ma develop khong co."
            echo "::error::Xu ly tay roi chay lai. Commit chi co tren staging:"
            git log --oneline "$develop_sha".."$staging_sha" >&2
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "develop_sha=$develop_sha" >> "$GITHUB_OUTPUT"

      - name: Bat buoc develop phai xanh
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.develop_sha }}
          REPO: ${{ github.repository }}
        run: |
          # staging deploy thang ra moi truong that, nen chi day commit da qua
          # du hai required check. Trang thai pending cung bi chan.
          for gate in ci-api-gate ci-web-gate; do
            result=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq "[.check_runs[] | select(.name==\"$gate\")]
                    | sort_by(.completed_at) | last | .conclusion // \"missing\"")
            echo "$gate = $result"
            if [ "$result" != "success" ]; then
              echo "::error::$gate tren develop dang la '$result', khong day."
              exit 1
            fi
          done

      - name: Fast-forward staging
        if: steps.check.outputs.skip == 'false'
        env:
          SHA: ${{ steps.check.outputs.develop_sha }}
        run: |
          # Khong dung --force: push bi tu choi neu vi ly do nao do day khong
          # con la fast-forward tai thoi diem day.
          git push origin "$SHA:refs/heads/staging"
          echo "::notice::staging da len $SHA. build-push se tu chay."
