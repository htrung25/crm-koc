name: deploy-prod

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag sha-* muốn deploy (dùng để rollback tiến)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            short="${tag#sha-}"
            commit=$(gh api "repos/$REPO/commits/$short" --jq '.sha')
          else
            tag="sha-${HEAD_SHA:0:7}"
            commit="$HEAD_SHA"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "deploy tag: $tag (commit $commit)"

      - name: Commit phải nằm trên main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          status=$(gh api "repos/$REPO/compare/main...$COMMIT" --jq '.status')
          echo "so với main: $status"
          case "$status" in
            behind|identical) ;;
            *) echo "::error::$COMMIT không nằm trên main ($status). Promote trước khi tag."
               exit 1 ;;
          esac

      # Cùng cổng mà promote-staging và promote-main đang dùng. 
      - name: CI phải xanh trên commit này
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          for gate in ci-api-gate ci-web-gate; do
            result=$(gh api "repos/$REPO/commits/$COMMIT/check-runs" \
              --jq "[.check_runs[] | select(.name==\"$gate\")]
                    | sort_by(.completed_at) | last | .conclusion // \"missing\"")
            echo "$gate = $result"
            if [ "$result" != "success" ]; then
              echo "::error::$gate trên $COMMIT đang là '$result', không deploy."
              exit 1
            fi
          done

      # Phụ thuộc tường minh vào artifact: build-push phải đã chạy XONG và
      # thành công cho commit này. Manifest tồn tại chưa đủ — nó không nói
      # build của lần chạy nào.
      - name: build-push phải thành công trên commit này
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          result=$(gh api "repos/$REPO/actions/workflows/build-push.yml/runs?head_sha=$COMMIT" \
            --jq '[.workflow_runs[] | select(.status=="completed")]
                  | sort_by(.updated_at) | last | .conclusion // "missing"')
          echo "build-push = $result"
          if [ "$result" != "success" ]; then
            echo "::error::build-push trên $COMMIT đang là '$result', không deploy."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chốt sang digest: tag ở GHCR ghi đè được, digest thì không. Từ đây trở
      # đi server kéo theo digest, không theo tên tag.
      - id: digest
        name: Phân giải tag sang digest
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for name in api web; do
            image="ghcr.io/$OWNER/crm-koc-$name:$IMAGE_TAG"
            digest=$(docker buildx imagetools inspect "$image" \
              --format '{{.Manifest.Digest}}')
            echo "$image -> $digest"
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
          done

      # Gắn nhãn phát hành lên CHÍNH image đó — sao chép manifest, không build
      # lại, nên digest không đổi.
      - name: Gắn tag semver
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE: ${{ github.ref_name }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for name in api web; do
            repo="ghcr.io/$OWNER/crm-koc-$name"
            docker buildx imagetools create -t "$repo:$RELEASE" "$repo:$IMAGE_TAG"
            echo "$repo:$RELEASE -> cùng digest với $IMAGE_TAG"
          done

      - name: Render .env
        env:
          STACK: prod
          DATABASE_USERNAME: ${{ vars.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          DEVICE_BINDING_ENFORCED: ${{ vars.DEVICE_BINDING_ENFORCED }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SOCIAL_TOKEN_ENCRYPTION_KEY: ${{ secrets.SOCIAL_TOKEN_ENCRYPTION_KEY }}
          SOCIAL_OAUTH_CALLBACK_BASE_URL: ${{ vars.SOCIAL_OAUTH_CALLBACK_BASE_URL }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ vars.STORAGE_REGION }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          KAFKA_ENABLED: ${{ vars.KAFKA_ENABLED }}
          KAFKA_BROKERS: ${{ vars.KAFKA_BROKERS }}
          KAFKA_PORT: ${{ vars.KAFKA_PORT }}
          KAFKA_CLIENT_ID: ${{ vars.KAFKA_CLIENT_ID }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
        run: |
          umask 077
          required=(
            DATABASE_USERNAME DATABASE_NAME CORS_ORIGIN
            SOCIAL_OAUTH_CALLBACK_BASE_URL STORAGE_ENDPOINT
            DATABASE_PASSWORD JWT_ACCESS_SECRET JWT_REFRESH_SECRET
            SOCIAL_TOKEN_ENCRYPTION_KEY STORAGE_ACCESS_KEY_ID
            STORAGE_SECRET_ACCESS_KEY STORAGE_BUCKET
          )
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Thiếu cấu hình production: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          cat > rendered.env <<EOF
          NODE_ENV=production
          PORT=3000
          DATABASE_HOST=postgres
          DATABASE_PORT=5432
          DATABASE_USERNAME=$DATABASE_USERNAME
          DATABASE_PASSWORD=$DATABASE_PASSWORD
          DATABASE_NAME=$DATABASE_NAME
          DATABASE_SSL_ENABLED=false
          POSTGRES_USER=$DATABASE_USERNAME
          POSTGRES_PASSWORD=$DATABASE_PASSWORD
          POSTGRES_DB=$DATABASE_NAME
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_DB=0
          REDIS_PASSWORD=${REDIS_PASSWORD:-}
          CORS_ORIGIN=$CORS_ORIGIN
          CORS_CREDENTIALS=true
          JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET
          JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
          JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
          JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-7d}
          JWT_ACCESS_TOKEN_EXPIRES_IN=${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
          SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-604800}
          SESSION_ABSOLUTE_TTL_SECONDS=${SESSION_ABSOLUTE_TTL_SECONDS:-604800}
          SESSION_MAX_PER_USER=${SESSION_MAX_PER_USER:-10}
          SESSION_MAX_PER_ADMIN=${SESSION_MAX_PER_ADMIN:-3}
          SESSION_TOUCH_INTERVAL_SECONDS=${SESSION_TOUCH_INTERVAL_SECONDS:-300}
          DEVICE_BINDING_ENFORCED=${DEVICE_BINDING_ENFORCED:-false}
          OTP_TTL_SECONDS=${OTP_TTL_SECONDS:-300}
          OTP_LOCK_TTL_SECONDS=${OTP_LOCK_TTL_SECONDS:-900}
          OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS:-5}
          OTP_RESEND_COOLDOWN_SECONDS=${OTP_RESEND_COOLDOWN_SECONDS:-60}
          OTP_MAX_RESENDS=${OTP_MAX_RESENDS:-5}
          OTP_RESEND_WINDOW_SECONDS=${OTP_RESEND_WINDOW_SECONDS:-3600}
          SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
          SENDGRID_FROM=${SENDGRID_FROM:-CRM-KOC System <no-reply@crm-koc.asia>}
          SYSTEM_CONFIG_CACHE_TTL_SECONDS=${SYSTEM_CONFIG_CACHE_TTL_SECONDS:-300}
          SWAGGER_ENABLED=false
          SOCIAL_TOKEN_ENCRYPTION_KEY=$SOCIAL_TOKEN_ENCRYPTION_KEY
          SOCIAL_OAUTH_CALLBACK_BASE_URL=$SOCIAL_OAUTH_CALLBACK_BASE_URL
          TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
          TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
          STORAGE_ENDPOINT=$STORAGE_ENDPOINT
          STORAGE_REGION=${STORAGE_REGION:-auto}
          STORAGE_ACCESS_KEY_ID=$STORAGE_ACCESS_KEY_ID
          STORAGE_SECRET_ACCESS_KEY=$STORAGE_SECRET_ACCESS_KEY
          STORAGE_BUCKET=$STORAGE_BUCKET
          KYC_MAX_FILE_SIZE_BYTES=${KYC_MAX_FILE_SIZE_BYTES:-10485760}
          KYC_VALIDITY_DAYS=${KYC_VALIDITY_DAYS:-365}
          STORAGE_SWEEP_PENDING_GRACE_MINUTES=${STORAGE_SWEEP_PENDING_GRACE_MINUTES:-60}
          KAFKA_ENABLED=${KAFKA_ENABLED:-false}
          KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
          KAFKA_PORT=${KAFKA_PORT:-9092}
          KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID:-crm-koc-api}
          KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-}
          KAFKA_USERNAME=${KAFKA_USERNAME:-}
          KAFKA_PASSWORD=${KAFKA_PASSWORD:-}
          EOF
          printf 'BACKUP_S3_BUCKET=%s\n' "$BACKUP_S3_BUCKET" >> rendered.env
          node scripts/check-env.js --compare api/.env.example rendered.env

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship files and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          API_DIGEST: ${{ steps.digest.outputs.api }}
          WEB_DIGEST: ${{ steps.digest.outputs.web }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          KAFKA_STACK: ${{ vars.KAFKA_STACK_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          ssh_opts="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          ssh $ssh_opts "$SSH_USER@$SSH_HOST" "mkdir -p /srv/crm-koc/{infra,prod,api-prod,web-prod}"

          rsync -az -e "ssh $ssh_opts" deploy/ "$SSH_USER@$SSH_HOST:/srv/crm-koc/infra/"
          rsync -az -e "ssh $ssh_opts" api/deploy/ "$SSH_USER@$SSH_HOST:/srv/crm-koc/api-prod/"
          rsync -az -e "ssh $ssh_opts" frontend-web/deploy/ "$SSH_USER@$SSH_HOST:/srv/crm-koc/web-prod/"

          # Tham chiếu bằng @digest, không phải :tag. IMAGE_TAG giữ lại chỉ để
          # người đọc log biết bản nào.
          printf 'IMAGE_TAG=%s\nAPI_IMAGE=ghcr.io/%s/crm-koc-api@%s\nSTACK=prod\n' \
            "$IMAGE_TAG" "$IMAGE_OWNER" "$API_DIGEST" > api.env.deploy
          printf 'IMAGE_TAG=%s\nWEB_IMAGE=ghcr.io/%s/crm-koc-web@%s\nSTACK=prod\n' \
            "$IMAGE_TAG" "$IMAGE_OWNER" "$WEB_DIGEST" > web.env.deploy

          scp $ssh_opts rendered.env "$SSH_USER@$SSH_HOST:/srv/crm-koc/prod/.env"
          scp $ssh_opts api.env.deploy "$SSH_USER@$SSH_HOST:/srv/crm-koc/api-prod/.env.deploy"
          scp $ssh_opts web.env.deploy "$SSH_USER@$SSH_HOST:/srv/crm-koc/web-prod/.env.deploy"

          printf '%s' "$GHCR_TOKEN" | ssh $ssh_opts "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          ssh $ssh_opts "$SSH_USER@$SSH_HOST" bash -s -- \
            prod "$IMAGE_TAG" "$KAFKA_STACK" "$API_DIGEST" "$WEB_DIGEST" <<'REMOTE'
          set -euo pipefail
          stack="$1"
          image_tag="$2"
          kafka_stack="${3:-false}"
          api_digest="${4:-}"
          web_digest="${5:-}"
          root=/srv/crm-koc
          env_dir="$root/$stack"
          api_dir="$root/api-$stack"
          web_dir="$root/web-$stack"
          infra_dir="$root/infra"

          chmod 600 "$env_dir/.env" "$api_dir/.env.deploy" "$web_dir/.env.deploy"

          APP_ENV_FILE="$env_dir/.env" STACK="$stack" docker compose \
            --env-file "$env_dir/.env" \
            -f "$infra_dir/services/compose.db.yml" \
            -p "crm-koc-${stack}-db" up -d
          kafka_compose() {
            STACK="$stack" docker compose \
              -f "$infra_dir/services/compose.kafka.yml" \
              -p "crm-koc-${stack}-kafka" "$@"
          }
          if [ "$kafka_stack" = "true" ]; then
            kafka_compose up -d
          else
            kafka_compose down || true
          fi

          api_compose() {
            APP_ENV_FILE="$env_dir/.env" STACK="$stack" docker compose \
              --env-file "$env_dir/.env" --env-file "$api_dir/.env.deploy" \
              -f "$api_dir/compose.api.base.yml" \
              -f "$api_dir/compose.api.$stack.yml" "$@"
          }
          web_compose() {
            STACK="$stack" docker compose \
              --env-file "$web_dir/.env.deploy" \
              -f "$web_dir/compose.web.base.yml" \
              -f "$web_dir/compose.web.$stack.yml" "$@"
          }
          # Ưu tiên digest; deploy trước khi đổi chỉ để lại .last-good dạng tag
          # nên vẫn phải quay về được bằng tag.
          image_ref() {
            if [ -n "$2" ]; then printf '%s@%s' "$1" "$2"; else printf '%s:%s' "$1" "$3"; fi
          }
          rollback_api() {
            api_compose logs --tail 100 api api-worker api-migrate >&2 || true
            if [ -n "${previous_api:-}" ]; then
              repo="ghcr.io/${{ github.repository_owner }}/crm-koc-api"
              printf 'IMAGE_TAG=%s\nAPI_IMAGE=%s\nSTACK=%s\n' \
                "$previous_api" \
                "$(image_ref "$repo" "${previous_api_digest:-}" "$previous_api")" \
                "$stack" > "$api_dir/.env.deploy"
              api_compose pull
              api_compose up -d --remove-orphans
            fi
            exit 1
          }
          rollback_web() {
            web_compose logs --tail 100 web >&2 || true
            if [ -n "${previous_web:-}" ]; then
              repo="ghcr.io/${{ github.repository_owner }}/crm-koc-web"
              printf 'IMAGE_TAG=%s\nWEB_IMAGE=%s\nSTACK=%s\n' \
                "$previous_web" \
                "$(image_ref "$repo" "${previous_web_digest:-}" "$previous_web")" \
                "$stack" > "$web_dir/.env.deploy"
              web_compose pull
              web_compose up -d --remove-orphans
            fi
            exit 1
          }

          previous_api=$(cat "$api_dir/.last-good" 2>/dev/null || true)
          previous_api_digest=$(cat "$api_dir/.last-good-digest" 2>/dev/null || true)
          api_compose pull
          api_compose up -d --remove-orphans || rollback_api
          deadline=$((SECONDS + 90))
          until api_compose exec -T api node -e \
              "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
            && api_compose exec -T api-worker node -e \
              "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; do
            [ "$SECONDS" -lt "$deadline" ] || rollback_api
            sleep 3
          done
          [ -f "$api_dir/.last-good" ] && cp "$api_dir/.last-good" "$api_dir/.previous-good"
          printf '%s\n' "$image_tag" > "$api_dir/.last-good"
          printf '%s\n' "$api_digest" > "$api_dir/.last-good-digest"

          previous_web=$(cat "$web_dir/.last-good" 2>/dev/null || true)
          previous_web_digest=$(cat "$web_dir/.last-good-digest" 2>/dev/null || true)
          web_compose pull
          web_compose up -d --remove-orphans || rollback_web
          deadline=$((SECONDS + 60))
          until web_compose exec -T web node -e \
            "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; do
            [ "$SECONDS" -lt "$deadline" ] || rollback_web
            sleep 3
          done
          [ -f "$web_dir/.last-good" ] && cp "$web_dir/.last-good" "$web_dir/.previous-good"
          printf '%s\n' "$image_tag" > "$web_dir/.last-good"
          printf '%s\n' "$web_digest" > "$web_dir/.last-good-digest"

          docker image prune -f > /dev/null
          REMOTE

      - name: Cleanup secrets
        if: always()
        run: rm -f rendered.env api.env.deploy web.env.deploy ~/.ssh/id_deploy
